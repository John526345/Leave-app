# Netlify configuration for Leave Tracker
#
# Every file in this project lives at the top level (flat) so nothing gets
# lost when uploading to GitHub. During the build we assemble the two folders
# Netlify expects:
#   - public/            the static app (index.html, manifest.json, icon.jpg)
#   - netlify/functions/ the single API function (built from api.js)
# Data is stored in Netlify Blobs (no database or disk to set up).

[build]
  command = "mkdir -p public netlify/functions && cp index.html manifest.json icon.jpg public/ && cp api.js netlify/functions/api.js"
  publish = "public"
  functions = "netlify/functions"

# Send every API call to the function...
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# ...and let the single-page app handle every other path
# (e.g. /join and /?recover=1). Real files in public/ are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
