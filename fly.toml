# Fly.io config — change "app" to your own unique name before deploying
app = "alongsiders-leave"
primary_region = "sin"   # Singapore — closest to Cambodia

[build]

[env]
  DATA_DIR = "/data"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
